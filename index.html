<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="FalkSports home page">
  <title>FalkSports</title>
  <style>
    :root { color-scheme: dark; --gold: #f2c300; --panel: #1c1c1c; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; font-family: Arial, Helvetica, sans-serif; background: #111; color: #fff; text-align: center; }
    .container { width: min(1200px, 100%); margin: auto; padding: 40px 20px; }
    .logo-wrap { display: grid; place-items: center; min-height: 180px; margin-bottom: 20px; }
    .main-logo { width: 220px; max-width: 90%; }
    .fallback { display: none; width: 180px; aspect-ratio: 1; place-items: center; border: 4px solid var(--gold); border-radius: 50%; color: var(--gold); font-weight: 800; font-size: 1.25rem; }
    h1 { margin: 0 0 10px; font-size: clamp(2.2rem, 6vw, 3rem); }
    .subtitle { margin: 0 0 60px; color: #ccc; font-size: 1.3rem; }
    .links { display: flex; justify-content: center; gap: 60px; flex-wrap: wrap; }
    .card { width: 320px; padding: 25px; color: #fff; text-decoration: none; background: var(--panel); border: 2px solid transparent; border-radius: 20px; transition: transform .2s, border-color .2s, box-shadow .2s; }
    .card:hover, .card:focus-visible { transform: translateY(-8px); border-color: var(--gold); box-shadow: 0 10px 25px #0008; outline: none; }
    .card .logo-wrap { min-height: 220px; margin-bottom: 20px; }
    .card img { width: 220px; max-width: 100%; }
    .card-title { font-size: 1.25rem; font-weight: 700; line-height: 1.4; }
    footer { margin-top: 80px; color: #888; font-size: .9rem; }
    @media (max-width: 768px) { .subtitle { font-size: 1.1rem; margin-bottom: 40px; } .links { gap: 24px; } .card { width: min(350px, 100%); } }
  </style>
</head>
<body>
  <main class="container">
    <div class="logo-wrap">
      <img src="FalkSports-icon.png" alt="FalkSports trophy logo" class="main-logo" onerror="this.style.display='none';this.nextElementSibling.style.display='grid'">
      <span class="fallback" aria-hidden="true">FalkSports<br>🏆</span>
    </div>
    <h1>Welcome to FalkSports</h1>
    <p class="subtitle">Choose your sporting experience.</p>
    <nav class="links" aria-label="FalkSports applications">
      <a class="card" href="https://falker1991.github.io/falkeval/" target="_blank" rel="noopener noreferrer">
        <span class="logo-wrap">
          <img src="FalkRef-icon.png" alt="FalkRef logo" onerror="this.style.display='none';this.nextElementSibling.style.display='grid'">
          <span class="fallback" aria-hidden="true">FalkRef<br>⚽</span>
        </span>
        <span class="card-title">FalkEval Soccer Referee Evaluation Tool</span>
      </a>
      <a class="card" href="https://falker1991.github.io/falksports-baseball-scorecard.github.io/" target="_blank" rel="noopener noreferrer">
        <span class="logo-wrap">
          <img src="FalkSports Baseball.png" alt="FalkSports Baseball logo" onerror="this.style.display='none';this.nextElementSibling.style.display='grid'">
          <span class="fallback" aria-hidden="true">FalkSports<br>⚾</span>
        </span>
        <span class="card-title">FalkSports Baseball ScoreCard</span>
      </a>
    </nav>
    <footer>&copy; FalkSports</footer>
  </main>
</body>
</html>
